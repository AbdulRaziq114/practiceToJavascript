<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
        margin: 0;    
        padding: 0;
        box-sizing: border-box;
        }
        #main{
            background-color: lightblue;
            width: 100%;
            height: 100vh;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            gap: 30px;
            justify-content:space-evenly;

        }
        
        .childBox{
            border: 2px solid black;
            height: 150px;
            width:max(200px,15vw);         
            text-align: center;
            align-content: center;
            background-color: rgb(8, 8, 84);
        color: wheat;
        font-size: max(18px,1.5vw);
        }
        #popupMain{
            min-height: 100%;
            width:100%;
            background-color: rgba(0, 0, 0, 0.801);
            position:fixed;
            top: 0;
            align-content: center;
            
            display: none;
        }
        #popup{
            height: auto;
            max-width:fit-content;
            border: 2px solid black;
            background-color: rgb(255, 255, 255);
            position: relative;
            border-radius: 20px;
            padding: 20px;
            margin:auto;
            box-shadow:inset 0 0 20px 2px rgb(0, 0, 0);
       
                     
        }
        h1{
            margin:5px 0 5px 0;
            font-weight: 300;
            font-size:max(18px,1.6vw) ;

        }
        #popup>button{
            padding:8px;
            background-color: rgb(236, 234, 234);
            border-radius: 20px;
            position: absolute;
            right: 18px;
            top: 18px;
            font-size:max(15px,1.2vw);
            box-shadow:inset 0 0 20px 2px rgb(0, 0, 0);
            border: none;
            cursor: pointer;
        }
    </style>

</head>
<body>
    <div id="main"></div>
    <div id="popupMain">
        <div id="popup">
            <button Onclick="popups('none')">Close</button>
           
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
